name: Android Direct VPS experiment
on:
  push:
    branches: [private/direct-mttl-lab]
    paths: ['app/**', 'build.gradle', 'settings.gradle', '.github/workflows/android-direct-vps.yml']
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test, lint and build isolated Direct VPS APK
        run: gradle --no-daemon testDirectVpsLabUnitTest lintDirectVpsLab assembleDirectVpsLab
      - uses: actions/upload-artifact@v4
        with:
          name: FG-Link-Direct-VPS-experimental
          path: app/build/outputs/apk/directVpsLab/*.apk
          if-no-files-found: error
