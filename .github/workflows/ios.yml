name: FG Link iOS
on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Core, TCP integration and Arabic/English UI tests
        run: bash ios/scripts/test-simulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FG-Link-iOS-2.1.2-Simulator
          path: |
            ios/build/SimulatorTests.xcresult
            ios/build/iPhone.png
            ios/build/Build/Products/Debug-iphonesimulator/FGLink.app
          if-no-files-found: warn
