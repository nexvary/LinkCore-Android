name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan full Git history for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FG_RCK_KEYSTORE_B64: ${{ secrets.FG_RCK_KEYSTORE_B64 }}
      FG_RCK_KEYSTORE_PASSWORD: ${{ secrets.FG_RCK_KEYSTORE_PASSWORD }}
      FG_RCK_KEY_ALIAS: ${{ secrets.FG_RCK_KEY_ALIAS }}
      FG_RCK_KEY_PASSWORD: ${{ secrets.FG_RCK_KEY_PASSWORD }}
      FG_RCK_CERT_SHA256: ${{ secrets.FG_RCK_CERT_SHA256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reject tracked signing secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(jks|keystore|p12|pfx)$'; then
            echo "Signing key material must never be committed to this public repository."
            exit 1
          fi

      - name: Validate Home Assistant integration syntax
        run: python3 -m compileall -q home_assistant/custom_components/fg_machines_rck

      - name: Test, lint and build debug + side-by-side + ARM64 fast APK
        run: gradle --no-daemon clean testDebugUnitTest lintDebug assembleDebug assembleSidecar assembleSidecarArm64

      - name: Verify Local-First connectivity policy
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'public static final boolean CLOUD_ON_HOLD = true;' app/src/main/java/com/fgmachines/rck/CloudRelayManager.java
          grep -q 'if (CLOUD_ON_HOLD || started) return;' app/src/main/java/com/fgmachines/rck/CloudRelayManager.java
          grep -q 'EndpointSecurity.isPrivateOrVpnEndpoint(endpoint)' app/src/main/java/com/fgmachines/rck/MainActivity.java
          grep -q 'LAN: ACTIVE' app/src/main/res/values/strings.xml
          grep -q 'ZeroTier: التحكم البعيد الأساسي' app/src/main/res/values-ar/strings.xml

      - name: Verify FG branding and launcher resources
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/res/drawable-nodpi/fg_machines_brand.webp
          test -s app/src/main/res/drawable/ic_fg_launcher_foreground.xml
          test -s app/src/main/res/drawable/ic_fg_logo.xml
          grep -q 'android:src="@drawable/fg_machines_brand"' app/src/main/res/layout/activity_main.xml
          grep -q 'android:text="@string/about_line"' app/src/main/res/layout/activity_main.xml
          grep -q 'android:text="@string/about_body"' app/src/main/res/layout/activity_main.xml
          sed -n '/android:id="@+id\/pageAbout"/,/<\/ScrollView>/p' app/src/main/res/layout/activity_main.xml > /tmp/fg-link-about-layout.xml
          grep -q 'android:id="@+id/alaaMohamedFacebookButton"' /tmp/fg-link-about-layout.xml
          grep -q 'android:id="@+id/fgMachinesFacebookButton"' /tmp/fg-link-about-layout.xml
          grep -q 'android:src="@drawable/fg_machines_brand"' /tmp/fg-link-about-layout.xml
          grep -q '<string name="about_title">عن المطور</string>' app/src/main/res/values-ar/strings.xml
          grep -q 'تم تطوير البرنامج بواسطة علاء الدين محمد' app/src/main/res/values-ar/strings.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' app/src/main/AndroidManifest.xml
          grep -q '@drawable/ic_fg_launcher_foreground' app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q '@drawable/ic_fg_launcher_foreground' app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          grep -q '@drawable/ic_fg_logo' app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q '@drawable/ic_fg_logo' app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Verify Devices page is hard-wired to equal 2-column rows
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'private LinearLayout devicesGrid;' app/src/main/java/com/fgmachines/rck/MainActivity.java
          grep -q 'row.setWeightSum(DeviceGridPolicy.COLUMNS);' app/src/main/java/com/fgmachines/rck/MainActivity.java
          grep -q 'LinearLayout.LayoutParams.WRAP_CONTENT, 1f' app/src/main/java/com/fgmachines/rck/MainActivity.java
          grep -q 'android:id="@+id/devicesGrid"' app/src/main/res/layout/activity_main.xml
          grep -q 'DeviceGridPolicy.visibleCount(records.size())' app/src/main/java/com/fgmachines/rck/MainActivity.java
          grep -q 'final String targetMac = FleetStore.normalizeMac(activeMac);' app/src/main/java/com/fgmachines/rck/MainActivity.java
          grep -q '<string name="nav_devices">أجهزتي</string>' app/src/main/res/values-ar/strings.xml
          grep -q '<string name="device_selected_current">' app/src/main/res/values/strings.xml
          if grep -B2 -A8 'android:id="@+id/devicesGrid"' app/src/main/res/layout/activity_main.xml | grep -q '<GridLayout'; then
            echo "Devices page must not use GridLayout; it regressed the 2x5 phone layout."
            exit 1
          fi

      - name: Verify Smart Home ecosystem bridge
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'configureEcosystemBridge();' app/src/main/java/com/fgmachines/rck/MainActivity.java
          grep -q 'SmartHomeEcosystemCatalog.readyRoutes()' app/src/main/java/com/fgmachines/rck/MainActivity.java
          grep -q 'android:id="@+id/ecosystemSetupButton"' app/src/main/res/layout/activity_main.xml
          grep -q 'android:id="@+id/sharingCard"' app/src/main/res/layout/activity_main.xml
          grep -q 'Amazon Alexa · جاهزة عبر Home Assistant' app/src/main/res/values-ar/strings.xml
          grep -q 'Google Home · READY via Home Assistant' app/src/main/res/values/strings.xml
          grep -q 'Matter · Windows Bridge BETA ready for real pairing test' app/src/main/res/values/strings.xml
          grep -q 'android:id="@+id/ecosystemMatterButton"' app/src/main/res/layout/activity_main.xml
          grep -q 'item.put("outlet_names", outletNames);' app/src/main/java/com/fgmachines/rck/LocalApiServer.java
          grep -q 'nexvary/LinkCore-Android' home_assistant/custom_components/fg_machines_rck/manifest.json

      - name: Verify side-by-side package identity
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          APK="app/build/outputs/apk/sidecar/app-sidecar.apk"
          "$AAPT" dump badging "$APK" | tee /tmp/sidecar-badging.txt
          grep -q "package: name='com.fgmachines.rck.sidecar163'" /tmp/sidecar-badging.txt
          grep -q "application-label:'FG Link 1.6.9 Test'" /tmp/sidecar-badging.txt

      - name: Verify ARM64 fast-install package
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | grep -i 'sidecarArm64' | head -n 1)"
          test -n "$AAPT"
          test -n "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/arm64-badging.txt
          grep -q "package: name='com.fgmachines.rck.sidecar163arm64'" /tmp/arm64-badging.txt
          grep -q "application-label:'FG Link 1.6.9 Fast'" /tmp/arm64-badging.txt
          if unzip -l "$APK" | grep -E 'lib/(x86|x86_64|armeabi-v7a)/'; then
            echo "Unexpected non-ARM64 native library found."
            exit 1
          fi
          ls -lh "$APK"

      - name: Prepare private release signing
        if: env.FG_RCK_KEYSTORE_B64 != ''
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FG_RCK_KEYSTORE_PASSWORD"
          test -n "$FG_RCK_KEY_ALIAS"
          test -n "$FG_RCK_KEY_PASSWORD"
          test -n "$FG_RCK_CERT_SHA256"
          KEYSTORE="$RUNNER_TEMP/fg-machines-rck-release.keystore"
          printf '%s' "$FG_RCK_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "FG_RCK_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build stable signed release APK
        if: env.FG_RCK_KEYSTORE_B64 != ''
        run: gradle --no-daemon assembleRelease

      - name: Verify stable release certificate
        if: env.FG_RCK_KEYSTORE_B64 != ''
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          APK="app/build/outputs/apk/release/app-release.apk"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apk-certs.txt
          ACTUAL="$(grep -i 'certificate SHA-256 digest' /tmp/apk-certs.txt | head -n 1 | awk '{print $NF}' | tr 'A-F' 'a-f' | tr -d ':')"
          EXPECTED="$(printf '%s' "$FG_RCK_CERT_SHA256" | tr 'A-F' 'a-f' | tr -d ':')"
          echo "Release signing SHA-256: $ACTUAL"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Upload stable signed release APK
        if: env.FG_RCK_KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: FG-Machines-RCK-stable-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload isolated debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FG-Link-1.6.9-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload side-by-side 1.6.9 APK
        uses: actions/upload-artifact@v4
        with:
          name: FG-Link-1.6.9-side-by-side
          path: app/build/outputs/apk/sidecar/app-sidecar.apk
          if-no-files-found: error

      - name: Upload ARM64 fast-install APK
        uses: actions/upload-artifact@v4
        with:
          name: FG-Link-1.6.9-ARM64-Fast
          path: app/build/outputs/apk/sidecarArm64/*.apk
          if-no-files-found: error


  # Visual capture is kept as an explicit/manual diagnostic. It is intentionally
  # not a PR release blocker because the hosted emulator can stall without KVM
  # even when the APK build, lint and tests are healthy.
  ui-screenshot:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download isolated debug APK
        uses: actions/download-artifact@v4
        with:
          name: FG-Link-1.6.9-debug
          path: apk-debug

      - name: Download side-by-side APK
        uses: actions/download-artifact@v4
        with:
          name: FG-Link-1.6.9-side-by-side
          path: apk-sidecar

      - name: Capture and verify dashboard + About branding
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/verify_fg_link_ui.sh

      - name: Upload real UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: FG-Link-1.6.9-ui-screenshots
          path: FG-Link-1.6.6-*.png
          if-no-files-found: error


  matter-bridge-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Matter bridge development dependencies
        shell: pwsh
        working-directory: matter_bridge
        run: npm install --no-fund --no-audit

      - name: Typecheck, test and build Matter bridge
        shell: pwsh
        working-directory: matter_bridge
        run: npm run verify

      - name: Validate Windows scripts and package contents
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Test-Path matter_bridge\dist\module.js | Should -BeTrue
          Test-Path matter_bridge\dist\fg-link-api.js | Should -BeTrue
          Test-Path matter_bridge\scripts\Install-FGLinkMatterBridge.ps1 | Should -BeTrue
          Test-Path matter_bridge\scripts\Start-FGLinkMatterBridge.ps1 | Should -BeTrue
          Test-Path matter_bridge\scripts\Doctor-FGLink.ps1 | Should -BeTrue
          Select-String -Path matter_bridge\src\module.ts -Pattern "onOffPlugInUnit" -Quiet | Should -BeTrue
          Select-String -Path matter_bridge\src\fg-link-api.ts -Pattern "/api/v1/devices/" -Quiet | Should -BeTrue

      - name: Create Windows beta ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:RUNNER_TEMP "FG-Link-Matter-Bridge-Windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item matter_bridge\dist $stage\dist -Recurse
          Copy-Item matter_bridge\scripts $stage\scripts -Recurse
          Copy-Item matter_bridge\package.json $stage
          Copy-Item matter_bridge\README.md $stage
          Copy-Item matter_bridge\matterbridge-fg-link.config.json $stage
          Copy-Item matter_bridge\matterbridge-fg-link.schema.json $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "$env:GITHUB_WORKSPACE\FG-Link-Matter-Bridge-Windows-1.6.9.zip" -Force

      - name: Upload Windows Matter Bridge beta
        uses: actions/upload-artifact@v4
        with:
          name: FG-Link-Matter-Bridge-Windows-1.6.9
          path: FG-Link-Matter-Bridge-Windows-1.6.9.zip
          if-no-files-found: error


  vps-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install cloud dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Run cloud API tests
        env:
          PYTHONPATH: server
          FGRCK_ENV: test
          FGRCK_DATABASE_URL: sqlite+pysqlite:///./server/tests/fgrck_ci.db
          FGRCK_JWT_SECRET: ci-jwt-secret-that-is-long-enough-and-not-production
          FGRCK_TOKEN_PEPPER: ci-token-pepper-that-is-long-enough-and-not-production
        run: pytest -q server/tests

      - name: Build VPS API image
        run: docker build -t fg-machines-rck-cloud-ci server

      - name: Validate production Compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          FGRCK_JWT_SECRET: ci-jwt-secret-that-is-long-enough-and-not-production
          FGRCK_TOKEN_PEPPER: ci-token-pepper-that-is-long-enough-and-not-production
          FGRCK_DOMAIN: cloud.example.com
          FGRCK_ACME_EMAIL: admin@example.com
        run: docker compose -f server/docker-compose.yml config
