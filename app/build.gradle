plugins {
    id 'com.android.application'
}

def signingEnv = [
        storeFile: System.getenv('FG_RCK_KEYSTORE_PATH'),
        storePassword: System.getenv('FG_RCK_KEYSTORE_PASSWORD'),
        keyAlias: System.getenv('FG_RCK_KEY_ALIAS'),
        keyPassword: System.getenv('FG_RCK_KEY_PASSWORD')
]
def stableSigningReady = signingEnv.values().every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.fgmachines.rck'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fgmachines.rck'
        minSdk 26
        targetSdk 35
        versionCode 34
        versionName '1.6.6'
        manifestPlaceholders = [appLabel: 'FG Link']
    }

    signingConfigs {
        if (stableSigningReady) {
            stableRelease {
                storeFile file(signingEnv.storeFile)
                storePassword signingEnv.storePassword
                keyAlias signingEnv.keyAlias
                keyPassword signingEnv.keyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            manifestPlaceholders = [appLabel: 'FG Link Debug']
        }
        sidecar {
            initWith debug
            applicationIdSuffix '.sidecar163'
            versionNameSuffix '-sidecar'
            matchingFallbacks = ['debug']
            manifestPlaceholders = [appLabel: 'FG Link 1.6.6 Test']
        }
        sidecarArm64 {
            initWith debug
            applicationIdSuffix '.sidecar163arm64'
            versionNameSuffix '-arm64-fast'
            matchingFallbacks = ['debug']
            manifestPlaceholders = [appLabel: 'FG Link 1.6.6 Fast']
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
        release {
            manifestPlaceholders = [appLabel: 'FG Link']
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (stableSigningReady) {
                signingConfig signingConfigs.stableRelease
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    testImplementation 'junit:junit:4.13.2'
}
